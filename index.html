<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wacky Chess</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <h1>Wacky Chess</h1>
  <div id="turn-indicator"></div>
  <div class="button-container">
    <button type="button" id="undo-button">Undo Move</button>
    <button type="button" id="redo-button">Redo Move</button>
    <button type="button" id="flip-button">Flip Board</button>
  </div>

  <div id="main-game-layout">
    <div id="player2-hand" class="card-hand"></div>
    
    <div id="game-container">
      <div id="chessboard"></div>
      <div id="game-over-message" class="hidden"></div>
    </div>
    
    <div id="player1-hand" class="card-hand"></div>
  </div>
  
  <script src="game/core.js"></script>
  <script src="script.js"></script>
</body>
</html>
